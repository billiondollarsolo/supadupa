apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projectreplicas.platform.supadupa.dev
  labels:
    app.kubernetes.io/managed-by: supadupa
spec:
  group: platform.supadupa.dev
  scope: Namespaced
  names:
    plural: projectreplicas
    singular: projectreplica
    kind: ProjectReplica
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                projectRef:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                resourceTier:
                  type: string
                region:
                  type: string
                hostId:
                  type: string
                readWeight:
                  type: integer
                  minimum: 0
                failoverPriority:
                  type: integer
                  minimum: 0
                runtimeSecurityDefaults:
                  type: object
                  properties:
                    seccompProfile:
                      type: string
                      enum:
                        - RuntimeDefault
                        - Localhost
                        - Unconfined
                    allowPrivilegeEscalation:
                      type: boolean
                    dropCapabilities:
                      type: array
                      items:
                        type: string
                        minLength: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

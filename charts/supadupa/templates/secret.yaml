{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "supadupa.secretName" . }}
  labels:
    {{- include "supadupa.labels" . | nindent 4 }}
type: Opaque
stringData:
  SUPADUPA_SECRET_KEY: {{ required "Set secrets.secretKey or secrets.existingSecret" .Values.secrets.secretKey | quote }}
  SUPADUPA_AUTH_SECRET: {{ required "Set secrets.authSecret or secrets.existingSecret" .Values.secrets.authSecret | quote }}
  SUPADUPA_ALLOW_DEV_SECRETS: {{ ternary "true" "" .Values.secrets.allowDevSecrets | quote }}
  {{- if .Values.metaDb.enabled }}
  POSTGRES_PASSWORD: {{ required "Set metaDb.password when metaDb.enabled=true" .Values.metaDb.password | quote }}
  {{- end }}
{{- end }}

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: retainedprojectresources.platform.supadupa.dev
  labels:
    app.kubernetes.io/managed-by: supadupa
spec:
  group: platform.supadupa.dev
  scope: Namespaced
  names:
    plural: retainedprojectresources
    singular: retainedprojectresources
    kind: RetainedProjectResources
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                projectRef:
                  type: string
                  minLength: 1
                retainedAt:
                  type: string
                  minLength: 1
                resources:
                  type: array
                  items:
                    type: object
                    properties:
                      kind:
                        type: string
                        minLength: 1
                      name:
                        type: string
                        minLength: 1
                instructions:
                  type: array
                  items:
                    type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

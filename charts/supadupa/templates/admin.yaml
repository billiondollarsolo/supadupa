apiVersion: v1
kind: Service
metadata:
  name: {{ include "supadupa.fullname" . }}-admin
  labels:
    {{- include "supadupa.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: {{ .Values.admin.service.type }}
  ports:
    - name: http
      port: {{ .Values.admin.service.port }}
      targetPort: http
  selector:
    {{- include "supadupa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supadupa.fullname" . }}-admin
  labels:
    {{- include "supadupa.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicaCount }}
  selector:
    matchLabels:
      {{- include "supadupa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        {{- include "supadupa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.admin.podSecurityContext | nindent 8 }}
      containers:
        - name: admin
          image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            {{- toYaml .Values.admin.securityContext | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}

{{- if .Values.serviceAccount.create }}
{{- $controlPlaneSA := include "supadupa.controlPlaneServiceAccountName" . }}
{{- $operatorSA := include "supadupa.operatorServiceAccountName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $controlPlaneSA }}
  labels:
    {{- include "supadupa.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
{{- if and .Values.operator.enabled (ne $operatorSA $controlPlaneSA) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $operatorSA }}
  labels:
    {{- include "supadupa.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
{{- end }}
{{- end }}

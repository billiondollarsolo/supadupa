apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projects.platform.supadupa.dev
  labels:
    app.kubernetes.io/managed-by: supadupa
spec:
  group: platform.supadupa.dev
  scope: Namespaced
  names:
    plural: projects
    singular: project
    kind: Project
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                ref:
                  type: string
                  minLength: 1
                orgId:
                  type: string
                displayName:
                  type: string
                desiredState:
                  type: string
                  enum:
                    - running
                    - paused
                    - destroying
                domain:
                  type: string
                stackVersion:
                  type: string
                profile:
                  type: string
                resourceTier:
                  type: string
                hostId:
                  type: string
                runtimeNamespace:
                  type: string
                runtimeNetwork:
                  type: object
                  properties:
                    allowedEgressCidrs:
                      type: array
                      items:
                        type: string
                    externalEgressPorts:
                      type: array
                      items:
                        type: integer
                        minimum: 1
                        maximum: 65535
                    databaseService:
                      type: string
                    databasePort:
                      type: integer
                      minimum: 1
                      maximum: 65535
                environment:
                  type: object
                  additionalProperties:
                    type: string
                runtimeSecurityDefaults:
                  type: object
                  properties:
                    seccompProfile:
                      type: string
                      enum:
                        - RuntimeDefault
                        - Localhost
                        - Unconfined
                    allowPrivilegeEscalation:
                      type: boolean
                    dropCapabilities:
                      type: array
                      items:
                        type: string
                        minLength: 1
                services:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      config:
                        type: object
                        additionalProperties:
                          type: string
                      image:
                        type: string
                      command:
                        type: array
                        items:
                          type: string
                      args:
                        type: array
                        items:
                          type: string
                      replicas:
                        type: integer
                        minimum: 0
                      dependsOn:
                        type: array
                        items:
                          type: object
                          required:
                            - service
                            - port
                          properties:
                            service:
                              type: string
                              minLength: 1
                            port:
                              type: integer
                              minimum: 1
                              maximum: 65535
                      ports:
                        type: array
                        items:
                          type: object
                          required:
                            - port
                          properties:
                            name:
                              type: string
                            port:
                              type: integer
                              minimum: 1
                              maximum: 65535
                            targetPort:
                              type: integer
                              minimum: 1
                              maximum: 65535
                            protocol:
                              type: string
                              enum:
                                - TCP
                                - UDP
                                - SCTP
                      serviceType:
                        type: string
                        enum:
                          - ClusterIP
                          - NodePort
                          - LoadBalancer
                          - ExternalName
                      env:
                        type: object
                        additionalProperties:
                          type: string
                      volumes:
                        type: array
                        items:
                          type: object
                          required:
                            - mountPath
                            - size
                          properties:
                            name:
                              type: string
                            mountPath:
                              type: string
                              minLength: 1
                            size:
                              type: string
                              minLength: 1
                            storageClassName:
                              type: string
                            retain:
                              type: boolean
                      configFiles:
                        type: array
                        items:
                          type: object
                          required:
                            - mountPath
                            - content
                          properties:
                            name:
                              type: string
                            mountPath:
                              type: string
                              minLength: 1
                            content:
                              type: string
                      writablePaths:
                        type: array
                        items:
                          type: object
                          required:
                            - mountPath
                          properties:
                            name:
                              type: string
                            mountPath:
                              type: string
                              minLength: 1
                      runAsNonRoot:
                        type: boolean
                      allowPrivilegeEscalation:
                        type: boolean
                      dropCapabilities:
                        type: array
                        items:
                          type: string
                      readOnlyRootFilesystem:
                        type: boolean
                      readinessProbe:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                              - http
                              - tcp
                          path:
                            type: string
                          port:
                            type: integer
                            minimum: 1
                            maximum: 65535
                          initialDelaySeconds:
                            type: integer
                            minimum: 0
                          periodSeconds:
                            type: integer
                            minimum: 1
                          timeoutSeconds:
                            type: integer
                            minimum: 1
                          failureThreshold:
                            type: integer
                            minimum: 1
                      livenessProbe:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                              - http
                              - tcp
                          path:
                            type: string
                          port:
                            type: integer
                            minimum: 1
                            maximum: 65535
                          initialDelaySeconds:
                            type: integer
                            minimum: 0
                          periodSeconds:
                            type: integer
                            minimum: 1
                          timeoutSeconds:
                            type: integer
                            minimum: 1
                          failureThreshold:
                            type: integer
                            minimum: 1
                      ingress:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                          host:
                            type: string
                            minLength: 1
                          path:
                            type: string
                          className:
                            type: string
                          annotations:
                            type: object
                            additionalProperties:
                              type: string
                          tlsSecretName:
                            type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                message:
                  type: string
                runtimeSecurityDefaults:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                lastReconciledAt:
                  type: string

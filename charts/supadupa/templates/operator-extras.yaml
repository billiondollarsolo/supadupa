{{- if .Values.operator.enabled }}
{{- if and .Values.operator.metrics.enabled .Values.operator.metrics.port }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supadupa.fullname" . }}-operator-metrics
  labels:
    {{- include "supadupa.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  type: ClusterIP
  selector:
    {{- include "supadupa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
  ports:
    - name: metrics
      port: {{ .Values.operator.metrics.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
{{- if .Values.operator.podDisruptionBudget.enabled }}
{{- /* D7: single-replica operator PDB with minAvailable blocks drains; needs HA + leader election. */ -}}
{{- if or (not .Values.operator.leaderElection.enabled) (le (int .Values.operator.replicaCount) 1) }}
{{- fail "operator.podDisruptionBudget.enabled requires leaderElection.enabled=true and operator.replicaCount > 1 (single replica PDB blocks voluntary node drains)" }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "supadupa.fullname" . }}-operator
  labels:
    {{- include "supadupa.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  minAvailable: {{ .Values.operator.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "supadupa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
{{- end }}
{{- if and .Values.operator.metrics.enabled .Values.operator.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "supadupa.fullname" . }}-operator
  labels:
    {{- include "supadupa.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
    {{- with .Values.operator.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "supadupa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.operator.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.operator.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- end }}

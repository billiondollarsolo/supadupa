apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projectauthhooks.platform.supadupa.dev
  labels:
    app.kubernetes.io/managed-by: supadupa
spec:
  group: platform.supadupa.dev
  scope: Namespaced
  names:
    plural: projectauthhooks
    singular: projectauthhooks
    kind: ProjectAuthHooks
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                projectRef:
                  type: string
                  minLength: 1
                hooks:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        minLength: 1
                      enabled:
                        type: boolean
                      status:
                        type: string
                      targetURI:
                        type: string
                      edgeFunction:
                        type: string
                      secretHandle:
                        type: string
                      timeoutMS:
                        type: integer
                        minimum: 0
                      retryAttempts:
                        type: integer
                        minimum: 0
                      headers:
                        type: object
                        additionalProperties:
                          type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
